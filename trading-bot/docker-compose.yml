version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bot:
    build: .
    container_name: trading_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./:/app
    command: python main.py

volumes:
  redis_data:
