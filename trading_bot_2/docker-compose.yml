services:
  trading-bot:
    build: .
    container_name: trading_signal_bot
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # Логи персистентны между перезапусками
      - ./logs:/app/logs

    # Бот не слушает порты, только исходящие соединения
    network_mode: bridge

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; asyncio.run(__import__('asyncio').sleep(0))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
