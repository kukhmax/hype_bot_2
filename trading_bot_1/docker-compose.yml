services:
  redis:
    image: redis:7-alpine
    container_name: trading_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  bot:
    build: .
    container_name: trading_bot_app
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
      - EXCHANGE=MEXC
    command: python3 -m bot.telegram_bot

volumes:
  redis_data:
