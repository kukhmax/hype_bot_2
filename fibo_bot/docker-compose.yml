version: "3.8"

services:
  fibo_bot:
    build: .
    container_name: fibo_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./ml/models:/app/ml/models
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: fibo_bot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
